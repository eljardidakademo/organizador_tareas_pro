# Compila la app cada vez que subes cambios a la rama "main":
#  - Genera la APK y la deja para descargar en la pestaña "Actions".
#  - Publica la versión web en GitHub Pages.
# También se puede lanzar a mano desde Actions > "Compilar APK y web" > "Run workflow".
name: Compilar APK y web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: compilar
  cancel-in-progress: true

jobs:
  apk:
    name: APK de Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      # Prepara la firma de la APK con los secretos del repositorio.
      # Siempre la misma firma = el móvil acepta las actualizaciones sin
      # desinstalar la app (y sin perder los datos guardados).
      - name: Preparar firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Faltan los secretos de la firma. La APK se firmará con una clave temporal."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/organizador.jks
          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=organizador
          storeFile=organizador.jks
          PROPS
          sed -i 's/^ *//' android/key.properties

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: organizador-tareas-pro-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  web:
    name: Versión web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - run: flutter pub get
      # La web se sirve en https://<usuario>.github.io/<repositorio>/
      - run: flutter build web --release --no-web-resources-cdn --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  publicar-web:
    name: Publicar en GitHub Pages
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
