name: organizador_tareas_pro
description: Organizador de tareas con comparativa de tiempos, Pomodoro y estadísticas.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.2

  # Se activarán en los próximos pasos:
  # firebase_core: ^latest
  # firebase_auth: ^latest
  # cloud_firestore: ^latest

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#3B82F6"
    theme_color: "#3B82F6"

flutter:
  uses-material-design: true
